<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#090a0c" />
  <title>TraceLens</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand-mark" aria-hidden="true">✦</div>
      <div class="brand-copy">
        <p class="eyebrow">TRACE ASSISTANT</p>
        <h1>TraceLens</h1>
      </div>
      <div class="session-pill"><span class="live-dot"></span> LIVE</div>
    </header>

    <section class="stage" id="stage" aria-label="Camera canvas">
      <video id="camera" autoplay playsinline muted></video>
      <img id="overlay" alt="Reference overlay" />
      <div class="grid" id="grid"></div>
      <div class="reticle" aria-hidden="true"><i></i><i></i><i></i><i></i><span></span></div>

      <div class="stage-topline">
        <span class="camera-state"><span class="status-dot"></span><span id="cameraState">CAMERA READY</span></span>
        <button class="mini-button" id="cameraButton" aria-label="Start or restart camera">↻</button>
      </div>

      <div class="empty-state" id="emptyState">
        <div class="empty-icon">＋</div>
        <strong>Bring a reference into view</strong>
        <span>Import an image to start tracing</span>
        <label class="primary-button file-button">
          Import image
          <input id="imageInput" type="file" accept="image/*" />
        </label>
      </div>

      <div class="layer-card" id="layerCard" hidden>
        <div class="layer-thumb"><img id="layerThumb" alt="" /></div>
        <div class="layer-info"><strong id="layerName">Reference image</strong><span>Overlay · <b id="opacityValue">55%</b></span></div>
        <button class="layer-action" id="layerVisibility" aria-label="Hide overlay">◉</button>
        <button class="layer-action" id="layerLock" aria-label="Lock overlay">♧</button>
      </div>

      <div class="gesture-hint" id="gestureHint">Drag to position · Pinch to scale</div>
    </section>

    <section class="control-area">
      <div class="adjust-sheet" id="adjustSheet" aria-hidden="true">
        <div class="sheet-heading"><div><span class="eyebrow">PRECISION</span><h2>Adjust overlay</h2></div><button class="close-button" id="closeAdjust" aria-label="Close adjust panel">×</button></div>
        <label class="slider"><span>Opacity <output id="opacityOutput">55%</output></span><input id="opacityInput" type="range" min="0.05" max="1" step="0.05" value="0.55" /></label>
        <label class="slider"><span>Scale <output id="scaleOutput">100%</output></span><input id="scaleInput" type="range" min="0.25" max="3" step="0.05" value="1" /></label>
        <label class="slider"><span>Rotation <output id="rotationOutput">0°</output></span><input id="rotationInput" type="range" min="-180" max="180" step="1" value="0" /></label>
      </div>

      <nav class="dock" aria-label="TraceLens tools">
        <label class="dock-button import-tool" aria-label="Import image"><span class="tool-icon">＋</span><span>Import</span><input id="dockImageInput" type="file" accept="image/*" /></label>
        <button class="dock-button" id="gridButton"><span class="tool-icon">⊞</span><span>Grid</span></button>
        <button class="dock-button" id="flipButton"><span class="tool-icon">⇆</span><span>Flip</span></button>
        <button class="dock-button" id="adjustButton"><span class="tool-icon">☷</span><span>Adjust</span></button>
        <button class="dock-button" id="resetButton"><span class="tool-icon">↺</span><span>Reset</span></button>
      </nav>
    </section>

    <p class="status" id="status">Ready when you are.</p>
  </main>
  <script src="app.js"></script>
</body>
</html>
